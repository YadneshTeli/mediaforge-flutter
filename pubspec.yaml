name: mediaforge_flutter
description: >-
  Privacy-first media processing and CDN upload for Flutter.
  Strip EXIF metadata on-device, compress, resize, and upload to MediaForge CDN.
version: 0.2.1
homepage: https://mediaforge.tech
repository: https://github.com/YadneshTeli/mediaforge-flutter
documentation: https://mediaforge.tech/docs/

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  exif: ^3.3.0
  http: ^1.2.0
  http_parser: ^4.0.0
  image: ^4.5.0

dev_dependencies:
  lints: ^5.0.0
  mocktail: ^1.0.0
  test: ^1.25.0

topics:
  - image-processing
  - exif
  - privacy
  - cdn
  - media
